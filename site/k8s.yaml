# minimlx.com — static landing page on k3s (Traefik ingress, cert-manager TLS).
#
# Follows the conventions already in this cluster: per-project namespace,
# `<project>-public` ingress, nginx-unprivileged serving from /content with a
# /healthz probe. Unlike adventure.io — which sits behind Cloudflare and uses a
# Cloudflare origin cert — minimlx.com resolves straight to this box, so TLS
# comes from the cluster's letsencrypt-production issuer over HTTP-01.
#
# The page ships in a ConfigMap that deploy.sh builds from ./index.html and
# ../assets/preview.png: no image to build, no registry.
apiVersion: v1
kind: Namespace
metadata:
  name: minimlx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minimlx-nginx
  namespace: minimlx
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /content;
        index index.html;

        add_header X-Content-Type-Options "nosniff"                 always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimlx-web
  namespace: minimlx
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: minimlx-web}
  template:
    metadata:
      labels: {app: minimlx-web}
      annotations:
        # Editing a ConfigMap does not restart pods; deploy.sh sets this to a
        # hash of the site files so a content change actually rolls out.
        minimlx.com/content-hash: "unset"
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080, name: http}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: content, mountPath: /content}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: conf
          configMap: {name: minimlx-nginx}
        - name: content
          configMap: {name: minimlx-site}
---
apiVersion: v1
kind: Service
metadata:
  name: minimlx-web
  namespace: minimlx
spec:
  selector: {app: minimlx-web}
  ports:
    - {name: http, port: 80, targetPort: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minimlx-public
  namespace: minimlx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts: [minimlx.com, www.minimlx.com]
      secretName: minimlx-tls
  rules:
    - host: minimlx.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: minimlx-web, port: {number: 80}}
    - host: www.minimlx.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: minimlx-web, port: {number: 80}}
